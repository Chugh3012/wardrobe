# ─────────────────────────────────────────────────────────────────────────────
# Comprehensive CI Pipeline — runs on every Pull Request
#
# Triggered when any code changes. Runs:
#   1. Backend build + unit tests
#   2. Frontend build + unit tests
#   3. Integration tests (backend HTTP handlers with mocked services)
#   4. E2E tests (Playwright — UI rendering against local preview server)
#   5. Security audit (npm audit for known vulnerabilities)
#
# No secrets are required for this workflow — it only tests, never deploys.
# Azure credentials are NOT used; all external services are mocked.
# ─────────────────────────────────────────────────────────────────────────────

name: CI — Build, Test & Validate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write   # For PR comments / status checks

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: build, lint, unit tests ─────────────────────────────────────
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript)
        run: npm run build

      - name: Unit tests
        run: npm test -- --reporter=verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── Frontend: build, lint, unit tests ────────────────────────────────────
  frontend:
    name: Frontend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (TypeScript)
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --reporter=verbose

      - name: Build (production)
        run: npm run build

      - name: Upload dist for E2E
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── Integration tests (backend HTTP layer, mocked services) ──────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npx vitest run --config vitest.integration.config.ts --reporter=verbose
        env:
          REQUIRE_AUTH: 'false'
          COSMOS_DB_ENDPOINT: 'https://mock.documents.azure.com:443/'
          COSMOS_DB_DATABASE_NAME: 'wardrobe'
          BLOB_ACCOUNT_NAME: ''

  # ── E2E — Playwright UI tests against local preview ─────────────────────
  e2e-ui:
    name: E2E — UI Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install frontend dependencies (for vite preview)
        working-directory: frontend
        run: npm ci

      - name: Run UI E2E tests
        working-directory: e2e
        run: npx playwright test --project=ui-desktop
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── Security audit — check for known vulnerabilities ─────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=critical
        # Fails CI on critical vulnerabilities. High/moderate are warnings.

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=critical

      - name: Check for secrets in code
        run: |
          echo "Checking for potential secrets..."
          # Fail the build if common secret patterns appear in tracked files.
          if git grep -iE '(password|secret|api[_-]?key)\s*[:=]\s*["\x27][^"\x27]{8,}' -- '*.ts' '*.tsx' '*.js' '*.json' \
            ':!**/package-lock.json' ':!**/local.settings.json.example' \
            ':!**/*.test.ts' ':!**/*.spec.ts'; then
            echo "::error::Hardcoded secrets detected in source code. See matches above."
            exit 1
          fi
          echo "No secrets detected \u2705"

  # ── Infra validation (Bicep lint) ────────────────────────────────────────
  infra:
    name: Infra — Bicep Lint
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.title, 'infra') ||
      contains(join(github.event.pull_request.labels.*.name, ','), 'infra') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Bicep lint
        run: az bicep build --file infra/main.bicep

  # ── Summary gate — all checks must pass ──────────────────────────────────
  ci-gate:
    name: CI Gate ✓
    runs-on: ubuntu-latest
    if: always()
    needs: [backend, frontend, integration, e2e-ui, security]

    steps:
      - name: Check all jobs passed
        run: |
          echo "Backend:     ${{ needs.backend.result }}"
          echo "Frontend:    ${{ needs.frontend.result }}"
          echo "Integration: ${{ needs.integration.result }}"
          echo "E2E UI:      ${{ needs.e2e-ui.result }}"
          echo "Security:    ${{ needs.security.result }}"

          if [[ "${{ needs.backend.result }}" != "success" ]] || \
             [[ "${{ needs.frontend.result }}" != "success" ]] || \
             [[ "${{ needs.integration.result }}" != "success" ]] || \
             [[ "${{ needs.e2e-ui.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed. See individual job logs."
            exit 1
          fi

          echo "All CI checks passed ✅"
